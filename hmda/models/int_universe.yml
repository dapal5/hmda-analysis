version: 2

models:
  - name: int_universe
    description: "{{ doc('int_universe') }}"
    columns:
      - name: denied
        description: 1 if action_taken = '3' (denied), else 0.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false

      - name: derived_race
        description: CFPB-derived applicant race category.
        data_tests:
          - not_null

      - name: occupancy_type
        description: Restricted by the analytical-universe filter to principal residences only.
        data_tests:
          - accepted_values:
              arguments:
                values: ["1"]

      - name: business_or_commercial_purpose
        description: Restricted by the analytical-universe filter to non-business-purpose loans only.
        data_tests:
          - accepted_values:
              arguments:
                values: ["2"]

      - name: reverse_mortgage
        description: Restricted by the analytical-universe filter to exclude reverse mortgages.
        data_tests:
          - accepted_values:
              arguments:
                values: ["2"]

      - name: open_end_line_of_credit
        description: Restricted by the analytical-universe filter to exclude open-end lines of credit (HELOCs).
        data_tests:
          - accepted_values:
              arguments:
                values: ["2"]

      - name: total_units
        description: Restricted by the analytical-universe filter to 1-4 unit properties.
        data_tests:
          - accepted_values:
              arguments:
                values: ["1", "2", "3", "4"]

      - name: action_taken
        description: Restricted by the analytical-universe filter to decisioned applications only.
        data_tests:
          - accepted_values:
              arguments:
                values: ["1", "2", "3"]

      - name: age
        description: Applicant age band. The '8888' (not applicable) sentinel is excluded by the analytical-universe filter.
        data_tests:
          - accepted_values:
              arguments:
                values: ["<25", "25-34", "35-44", "45-54", "55-64", "65-74", ">74"]
